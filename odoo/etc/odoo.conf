[options]
; This is the Odoo server configuration file.
; Connection settings are also supplied via env vars (.env) by the image entrypoint.

addons_path = /mnt/addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

admin_passwd = admin_password

db_host = odoo-postgres
db_port = 5432
db_user = odoo
db_password = odoo_password

; Restrict which databases are exposed in the web selector
dbfilter = .*

; Network
http_interface = 0.0.0.0
http_port = 8069

; Logging
log_level = info
