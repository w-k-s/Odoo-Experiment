services:
  odoo-postgres:
    container_name: odoo-postgres
    image: postgres:17.2-alpine3.21
    restart: unless-stopped
    env_file: ./odoo/.pg.env
    user: root
    # Logical replication so Debezium can capture changes via pgoutput.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 60s
      retries: 10
    volumes:
      - ./odoo/pg-data:/var/lib/postgresql/data

  # One-shot service: initializes the odoo database (installs base + desired
  # modules) then exits. Runs before the main odoo service starts.
  odoo-init:
    container_name: odoo-init
    image: odoo:18.0-20250218
    user: root
    depends_on:
      odoo-postgres:
        condition: service_healthy
    restart: "no"
    command: odoo -c /etc/odoo/odoo.conf -d odoo -i base --without-demo=all --stop-after-init
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./odoo/addons:/mnt/addons
      - ./odoo/etc:/etc/odoo

  odoo:
    container_name: odoo
    image: odoo:18.0-20250218
    restart: unless-stopped
    user: root
    depends_on:
      odoo-postgres:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
    tty: true
    command: --
    env_file: ./odoo/.env.docker
    ports:
      - "8069:8069"
    volumes:
      # - ./entrypoint.sh:/entrypoint.sh   # if you want to install additional Python packages, uncomment this line!
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - ./odoo/addons:/mnt/addons
      - ./odoo/etc:/etc/odoo

  # ---- Loyalty backend (Phase 3) ----
  loyalty-postgres:
    container_name: loyalty-postgres
    image: postgres:17.2-alpine3.21
    restart: unless-stopped
    env_file: ./backend/loyalty.pg.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "loyalty"]
      interval: 5s
      timeout: 60s
      retries: 10
    ports:
      # Exposed on 5433 to avoid clashing with the odoo postgres.
      - "5433:5432"
    volumes:
      - ./backend/pg-data:/var/lib/postgresql/data

  loyalty-backend:
    container_name: loyalty-backend
    build: ./backend
    restart: unless-stopped
    depends_on:
      loyalty-postgres:
        condition: service_healthy
    # Docker-specific env (in-network addresses + secrets); gitignored.
    # Use backend/.env for local non-docker runs instead.
    env_file: ./backend/.env.docker
    ports:
      - "8000:8000"

  # ---- Loyalty member PWA (Phase 4) ----
  loyalty-pwa:
    container_name: loyalty-pwa
    build:
      context: ./frontend
      args:
        VITE_AUTH0_DOMAIN: wks-bakery.eu.auth0.com
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-jrvgFWjBsJQVleaJuVumT2NAffwZDQzv}
        VITE_AUTH0_AUDIENCE: https://wks-bakery.eu.auth0.com/api/v2/
        VITE_API_BASE: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - loyalty-backend
    ports:
      - "8080:80"

  # ---- Kafka (Phase 6 event backbone) ----
  # Single-node KRaft (no Zookeeper). Two listeners: PLAINTEXT for in-network
  # services (kafka:9092) and PLAINTEXT_HOST for tools on the host (localhost:29092).
  kafka:
    container_name: kafka
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - ./kafka/data:/var/lib/kafka/data

  # Web UI for inspecting topics/messages.
  kafka-ui:
    container_name: kafka-ui
    image: kafbat/kafka-ui:latest
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8081:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ---- Debezium (Phase 6 CDC) ----
  # Kafka Connect + Debezium. Captures Odoo's sale_order table from Postgres
  # (logical replication / pgoutput) and, via SMTs, forwards only confirmed
  # orders (state = 'sale') to the `confirmed-orders` topic.
  debezium:
    container_name: debezium
    build: ./debezium
    restart: unless-stopped
    depends_on:
      - kafka
      - odoo-postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: loyalty-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      # Enables the scripting-based Filter SMT (groovy) used to keep only
      # confirmed orders.
      ENABLE_DEBEZIUM_SCRIPTING: "true"

  # One-shot: registers/updates the Debezium connector once Connect is up.
  debezium-init:
    container_name: debezium-init
    image: curlimages/curl:8.10.1
    restart: "no"
    depends_on:
      - debezium
    volumes:
      - ./debezium:/cfg:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        until curl -sf http://debezium:8083/ >/dev/null; do echo 'waiting for connect...'; sleep 3; done
        echo 'registering connector...'
        curl -sf -X PUT -H 'Content-Type: application/json' \
          --data @/cfg/confirmed-orders-connector.json \
          http://debezium:8083/connectors/odoo-orders-connector/config \
          && echo 'connector registered' || { echo 'registration failed'; exit 1; }
