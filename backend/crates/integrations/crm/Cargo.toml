[package]
name = "crm"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { path = "../../utils" }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
