[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.7"
api_utils = { path = "../api_utils" }
utils = { path = "../../utils" }
loyalty = { path = "../../integrations/loyalty" }
crm = { path = "../../integrations/crm" }

# Auth: Auth0 JWT verification (JWKS layer + claims extractor for axum)
jwt-authorizer = "0.15"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"