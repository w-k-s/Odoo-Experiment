server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every route falls back to index.html so client-side routing works
    # (including the Auth0 /callback redirect).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the service worker or it can pin a stale app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
